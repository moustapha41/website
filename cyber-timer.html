<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronomètre de Sécurité</title>
    <link rel="stylesheet" href="assets/css/cyber-timer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="cyber-container">
        <div class="cyber-header">
            <h1>Système de Sécurité</h1>
            <div class="theme-toggle">
                <i class="fas fa-moon"></i>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider round"></span>
                </label>
                <i class="fas fa-sun"></i>
            </div>
            <div class="language-selector">
                <select id="language-select">
                    <option value="fr">FR</option>
                    <option value="en">EN</option>
                </select>
            </div>
        </div>
        
        <div class="cyber-timer" id="cyberTimer">
            <div class="timer-display">
                <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span>.<span id="milliseconds">000</span>
            </div>
            <div class="timer-buttons">
                <button id="startBtn" class="cyber-button">Démarrer</button>
                <button id="stopBtn" class="cyber-button">Arrêter</button>
                <button id="resetBtn" class="cyber-button">Réinitialiser</button>
            </div>
        </div>

        <div class="cyber-grid">
            <div class="cyber-card">
                <i class="fas fa-shield-alt"></i>
                <h3 data-i18n="firewall">Pare-feu Actif</h3>
                <div class="status-indicator active"></div>
            </div>
            <div class="cyber-card">
                <i class="fas fa-lock"></i>
                <h3 data-i18n="encryption">Chiffrement 256-bit</h3>
                <div class="status-indicator active"></div>
            </div>
            <div class="cyber-card">
                <i class="fas fa-network-wired"></i>
                <h3 data-i18n="network">Réseau Sécurisé</h3>
                <div class="status-indicator active"></div>
            </div>
        </div>

        <div class="cyber-scan">
            <div class="scan-line"></div>
            <div class="scan-line"></div>
            <div class="scan-line"></div>
        </div>
    </div>

    <script src="assets/js/cyber-timer.js"></script>
</body>
</html>
